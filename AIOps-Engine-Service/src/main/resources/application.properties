spring.application.name=AIOps-Engine-Service

server.port=8083
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:5000/eureka/
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client=DEBUG

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty=DEBUG
management.endpoints.web.exposure.include=*
eureka.client.should-respect-vip-address-equivalence=true

eureka.client.register-with-eureka=false

eureka.client.fetch-registry=true

pat=

spring.datasource.url=jdbc:postgresql://localhost:5433/Microservices
spring.datasource.username=postgres
spring.datasource.password=arun

#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Consumer Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=aiops-logs-group-v4
#spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Change this from earliest to latest
spring.kafka.consumer.auto-offset-reset=latest



logging.level.org.springframework.ai=DEBUG


logging.level.org.springframework.ai.chat.client.advisor=DEBUG

logging.level.com.google.genai=DEBUG
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.apache.http=DEBUG
spring.kafka.listener.ack-mode=record
#spring.ai.google.genai.chat.options.timeout=90s
#spring.ai.google.genai.api-key=${G_API_KEY}
#spring.ai.google.genai.chat.options.model=gemini-3.8-flash
#spring.ai.google.genai.embedding.text.dimensions=1024
#spring.ai.google.genai.embedding.api-key=${G_API_KEY}
#spring.ai.google.genai.embedding.options.model=gemini-embedding-2
#spring.ai.google.genai.embedding.project-id=dummy-project-id
#spring.ai.google.genai.embedding.location=us-central1
spring.kafka.consumer.properties.max.poll.interval.ms=600000

spring.kafka.consumer.max-poll-records=5
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:latest
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.ai.vectorstore.pinecone.api-key=${P_API_KEY}
spring.ai.vectorstore.pinecone.index-name=project4
spring.ai.vectorstore.pinecone.namespace=policies
