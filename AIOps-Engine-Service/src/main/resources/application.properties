spring.application.name=AIOps-Engine-Service

server.port=8083
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:5000/eureka/
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client=DEBUG

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty=DEBUG
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.name=AiOps Engine Service
info.app.version=1.0.0


//DB


spring.datasource.url=jdbc:postgresql://localhost:5433/Microservices
spring.datasource.username=postgres
spring.datasource.password=arun

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Consumer Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=aiops-logs-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer





spring.ai.google.genai.api-key=${G_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.embedding.options.output-dimensionality=1024


spring.ai.google.genai.embedding.api-key=${G_API_KEY}
spring.ai.google.genai.embedding.options.model=gemini-embedding-2


spring.ai.google.genai.embedding.project-id=dummy-project-id
spring.ai.google.genai.embedding.location=us-central1



#spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=llama3.2
#spring.ai.ollama.embedding.options.model=nomic-embed-text
#spring.ai.ollama.embedding.options.output-dimensionality=1024

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.ai.vectorstore.pinecone.api-key=${P_API_KEY}
spring.ai.vectorstore.pinecone.index-name=support4
spring.ai.vectorstore.pinecone.namespace=policies
