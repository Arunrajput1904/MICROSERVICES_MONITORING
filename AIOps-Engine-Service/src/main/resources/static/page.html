<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOps Enterprise Control Plane</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 950: '#0b0f19' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Cross-theme Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .chat-bubble { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Syntax Highlighting */
        .keyword { font-weight: bold; color: #0284c7; }
        .dark .keyword { color: #38bdf8; }
        .type { color: #059669; }
        .dark .type { color: #34d399; }
        .string { color: #e11d48; }
        .dark .string { color: #fb7185; }
        .removed { color: #991b1b; background-color: #fee2e2; text-decoration: line-through; display: inline-block; width: 100%; }
        .dark .removed { color: #fca5a5; background-color: #7f1d1d40; }
        .added { color: #166534; background-color: #dcfce7; font-weight: bold; display: inline-block; width: 100%; }
        .dark .added { color: #6ee7b7; background-color: #14532d40; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-slate-300 font-sans antialiased h-screen w-screen overflow-hidden flex transition-colors duration-200 selection:bg-indigo-200 dark:selection:bg-indigo-900">

<!-- Global Navigation Sidebar -->
<aside class="w-16 bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-800 flex flex-col items-center py-4 gap-6 shrink-0 z-20 shadow-sm transition-colors duration-200">
    <div class="p-2 bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-400 rounded-xl border border-indigo-200 dark:border-indigo-500/30 shadow-sm">
        <i data-lucide="hexagon" class="w-6 h-6"></i>
    </div>
    <nav class="flex flex-col gap-4 mt-4 w-full px-2 flex-1">
        <button class="p-3 text-gray-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-xl transition-all flex justify-center">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        </button>
        <button class="p-3 text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-500/10 rounded-xl transition-all border border-rose-100 dark:border-rose-500/20 flex justify-center shadow-sm">
            <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </button>
        <button class="p-3 text-gray-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-xl transition-all flex justify-center">
            <i data-lucide="server" class="w-5 h-5"></i>
        </button>
    </nav>

    <!-- Theme Toggle -->
    <button onclick="toggleTheme()" class="p-3 mb-2 text-gray-400 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-xl transition-all flex justify-center">
        <i data-lucide="moon" id="theme-icon" class="w-5 h-5"></i>
    </button>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Header & Telemetry -->
    <header class="h-14 px-6 border-b border-gray-200 dark:border-slate-800 flex items-center justify-between shrink-0 bg-white dark:bg-slate-900 z-10 transition-colors duration-200">
        <div>
            <h1 class="text-base font-bold tracking-tight text-gray-900 dark:text-white flex items-center gap-2">
                Incident Command <span class="px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 text-[10px] uppercase font-bold border border-rose-200 dark:border-rose-500/30 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> Live</span>
            </h1>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex flex-col items-end">
                <span class="text-[9px] text-gray-500 dark:text-slate-400 font-bold uppercase tracking-wider">Cluster CPU</span>
                <div class="flex items-center gap-1">
                    <span id="metric-cpu" class="text-emerald-600 dark:text-emerald-400 font-mono font-bold text-sm">42%</span>
                    <i data-lucide="activity" class="w-3 h-3 text-emerald-600 dark:text-emerald-400"></i>
                </div>
            </div>
            <div class="h-6 w-px bg-gray-200 dark:bg-slate-700"></div>
            <div class="flex flex-col items-end">
                <span class="text-[9px] text-gray-500 dark:text-slate-400 font-bold uppercase tracking-wider">Global RAM</span>
                <div class="flex items-center gap-1">
                    <span id="metric-ram" class="text-rose-600 dark:text-rose-400 font-mono font-bold text-sm">24.5</span>
                    <span class="text-[10px] text-gray-400 dark:text-slate-500 font-mono mt-0.5">GB</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Microservices Health Ribbon -->
    <div class="h-16 shrink-0 border-b border-gray-200 dark:border-slate-800 bg-gray-50 dark:bg-slate-950 flex items-center px-4 overflow-x-auto hide-scrollbar relative transition-colors duration-200">
        <div id="services-ribbon" class="flex items-center gap-3"></div>
        <div class="absolute right-0 top-0 bottom-0 w-12 bg-gradient-to-l from-gray-50 dark:from-slate-950 to-transparent pointer-events-none transition-colors duration-200"></div>
    </div>

    <!-- Workspace Layout -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Alert Queue -->
        <aside class="w-[320px] border-r border-gray-200 dark:border-slate-800 flex flex-col bg-white dark:bg-slate-900 shrink-0 z-0 transition-colors duration-200">
            <div class="p-3 border-b border-gray-100 dark:border-slate-800 flex justify-between items-center bg-gray-50/50 dark:bg-slate-850">
                <h2 class="text-[11px] font-bold text-gray-600 dark:text-slate-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="list-filter" class="w-3.5 h-3.5"></i> Alert Queue
                </h2>
                <span class="bg-rose-100 dark:bg-rose-500/20 text-rose-700 dark:text-rose-400 text-xs px-2 py-0.5 rounded-full font-mono font-bold" id="incident-count">0</span>
            </div>
            <div id="incident-list" class="flex-1 overflow-y-auto p-2.5 flex flex-col gap-2"></div>
        </aside>

        <!-- Incident Detail -->
        <section class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <div class="max-w-7xl mx-auto w-full p-4 md:p-6 flex flex-col gap-6">

                <!-- Header Card -->
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm relative overflow-hidden transition-colors duration-200">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="flex items-center gap-3 mb-2">
                                <span id="detail-type-badge" class="text-[10px] font-bold px-2 py-0.5 rounded tracking-wide uppercase border"></span>
                                <span id="detail-time" class="text-xs text-gray-400 dark:text-slate-500 font-mono"></span>
                            </div>
                            <h2 id="detail-id" class="text-2xl font-black text-gray-900 dark:text-white font-mono tracking-tight mb-1">Select an incident</h2>
                            <p id="detail-exception" class="text-rose-600 dark:text-rose-400 font-mono text-sm font-semibold"></p>
                        </div>

                        <div class="flex flex-col items-end gap-3">
                            <div id="pr-status-container" class="flex items-center gap-2 bg-gray-50 dark:bg-slate-950 px-4 py-2 rounded-lg border border-gray-200 dark:border-slate-800"></div>
                            <button id="merge-btn" onclick="mergePullRequest()" class="hidden bg-indigo-600 text-white hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 px-5 py-2 rounded-lg font-bold text-sm transition-all flex items-center gap-2 shadow-md shadow-indigo-600/20">
                                <i data-lucide="git-merge" class="w-4 h-4"></i> Merge Pull Request
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Analysis Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 h-[calc(100vh-280px)] min-h-[500px]">

                    <!-- Left Column: Diagnostics & Code -->
                    <div class="lg:col-span-3 flex flex-col gap-4">
                        <div class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl p-4 shadow-sm transition-colors duration-200">
                            <h3 class="text-[11px] font-bold text-gray-500 dark:text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                                <i data-lucide="brain-circuit" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i> AI Diagnosis
                            </h3>
                            <p id="detail-root-cause" class="text-gray-700 dark:text-slate-300 leading-relaxed text-sm font-medium">...</p>
                        </div>

                        <div class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl overflow-hidden flex flex-col flex-1 shadow-sm transition-colors duration-200">
                            <div class="bg-gray-50 dark:bg-slate-850 px-4 py-2 border-b border-gray-200 dark:border-slate-800 flex justify-between items-center">
                                <span class="text-xs font-mono text-gray-700 dark:text-slate-300 flex items-center gap-2">
                                    <i data-lucide="file-code" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i> <span id="detail-filename">file</span>
                                </span>
                                <div class="flex items-center gap-3 text-xs text-gray-500 dark:text-slate-400">
                                    <span class="flex items-center gap-1 text-emerald-700 dark:text-emerald-400 bg-emerald-100 dark:bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-200 dark:border-emerald-500/20 font-bold">
                                        <i data-lucide="shield-check" class="w-3 h-3"></i> AST Verified
                                    </span>
                                </div>
                            </div>
                            <div class="p-4 overflow-x-auto text-[13px] font-mono leading-relaxed flex-1 text-gray-800 dark:text-slate-200 bg-white dark:bg-slate-900">
                                <pre><code id="detail-patch"></code></pre>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Copilot -->
                    <div class="lg:col-span-2 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl shadow-sm flex flex-col overflow-hidden transition-colors duration-200">
                        <div class="p-3 border-b border-gray-200 dark:border-slate-800 bg-gray-50 dark:bg-slate-850 flex items-center justify-between">
                            <h2 class="text-sm font-bold text-gray-800 dark:text-white flex items-center gap-2">
                                <i data-lucide="bot" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i> SRE Copilot
                            </h2>
                            <span class="flex h-2 w-2 relative">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                            </span>
                        </div>

                        <div id="chat-window" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                            <div class="chat-bubble flex gap-3">
                                <div class="w-6 h-6 rounded-full bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-400 flex items-center justify-center shrink-0 border border-indigo-200 dark:border-indigo-500/30"><i data-lucide="bot" class="w-3 h-3"></i></div>
                                <div class="bg-gray-50 dark:bg-slate-800 p-3 rounded-xl rounded-tl-none text-sm text-gray-700 dark:text-slate-200 border border-gray-200 dark:border-slate-700 shadow-sm leading-relaxed">
                                    Ready to assist. Review the generated patch on the left. You can ask me to explain the logic, check logs, or run tests before merging.
                                </div>
                            </div>
                        </div>

                        <div class="p-3 border-t border-gray-200 dark:border-slate-800 bg-gray-50 dark:bg-slate-850">
                            <form id="chat-form" class="flex items-center gap-2 relative">
                                <input type="text" id="chat-input" placeholder="Message Copilot..." class="flex-1 bg-white dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-lg pl-3 pr-10 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                                <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-gray-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                                    <i data-lucide="send" class="w-4 h-4"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </div>
</main>

<script>
    // Theme Toggle Logic
    function toggleTheme() {
        const html = document.documentElement;
        const icon = document.getElementById('theme-icon');
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            icon.setAttribute('data-lucide', 'sun');
        } else {
            html.classList.add('dark');
            icon.setAttribute('data-lucide', 'moon');
        }
        lucide.createIcons();
    }

    const services = [
        { name: "API-Gateway", status: "healthy", latency: 24 },
        { name: "Auth-Service", status: "healthy", latency: 45 },
        { name: "Address-Service", status: "degraded", latency: 412 },
        { name: "Order-DB-Pod", status: "down", latency: 0 },
        { name: "Payment-Service", status: "healthy", latency: 85 },
        { name: "Kafka-Broker", status: "healthy", latency: 12 },
        { name: "Inventory-Service", status: "healthy", latency: 33 }
    ];

    function renderServiceRibbon() {
        const ribbon = document.getElementById('services-ribbon');
        ribbon.innerHTML = '';

        services.forEach(svc => {
            let statusColor, dotColor, icon;
            if (svc.status === 'healthy') {
                statusColor = 'bg-white dark:bg-slate-900 border-gray-200 dark:border-slate-800 text-gray-700 dark:text-slate-300';
                dotColor = 'bg-emerald-500';
                icon = '<i data-lucide="check-circle-2" class="w-3 h-3 text-emerald-600 dark:text-emerald-400"></i>';
            } else if (svc.status === 'degraded') {
                statusColor = 'bg-orange-50 dark:bg-orange-500/10 border-orange-200 dark:border-orange-500/30 text-orange-800 dark:text-orange-400';
                dotColor = 'bg-orange-500';
                icon = '<i data-lucide="alert-circle" class="w-3 h-3 text-orange-600 dark:text-orange-400"></i>';
            } else {
                statusColor = 'bg-rose-50 dark:bg-rose-500/10 border-rose-200 dark:border-rose-500/30 text-rose-800 dark:text-rose-400';
                dotColor = 'bg-rose-500';
                icon = '<i data-lucide="x-circle" class="w-3 h-3 text-rose-600 dark:text-rose-400"></i>';
            }

            const latencyDisplay = svc.latency > 0 ? `${svc.latency}ms` : '--';

            const div = document.createElement('div');
            div.className = `flex flex-col min-w-[130px] p-2 rounded-lg border shadow-sm transition-colors ${statusColor}`;
            div.innerHTML = `
          <div class="flex items-center justify-between mb-1">
            <span class="text-[10px] font-bold truncate pr-2">${svc.name}</span>
            <div class="w-1.5 h-1.5 rounded-full ${dotColor} ${svc.status === 'healthy' ? '' : 'animate-pulse'}"></div>
          </div>
          <div class="flex items-center justify-between text-[9px] font-mono opacity-80">
            <span class="flex items-center gap-1">${icon} ${svc.status}</span>
            <span>${latencyDisplay}</span>
          </div>
        `;
            ribbon.appendChild(div);
        });
        lucide.createIcons();
    }

    setInterval(() => {
        services.forEach(svc => {
            if (svc.status === 'healthy') svc.latency = Math.max(10, svc.latency + (Math.floor(Math.random() * 11) - 5));
        });
        renderServiceRibbon();
    }, 3000);

    setInterval(() => {
        const cpu = document.getElementById('metric-cpu');
        const ram = document.getElementById('metric-ram');
        let currentCpu = parseInt(cpu.innerText);
        let nextCpu = currentCpu + (Math.floor(Math.random() * 5) - 2);
        cpu.innerText = Math.max(35, Math.min(nextCpu, 65)) + '%';
        let currentRam = parseFloat(ram.innerText);
        let nextRam = currentRam + (Math.random() * 0.4 - 0.2);
        ram.innerText = Math.max(23.0, Math.min(nextRam, 25.5)).toFixed(1);
    }, 2000);

    const incidents = [
        {
            id: "INC-726efb93", type: "APP", service: "Address-Service", timestamp: new Date().toISOString(),
            exception: "java.lang.NullPointerException", location: "AddressController.java:58", status: "PR_READY", filename: "AddressController.java",
            rootCause: "Hardcoded NullPointerException explicitly thrown inside getdataexception() endpoint.",
            patch: `<span class="keyword">@GetMapping</span>(<span class="string">"/getdataexception"</span>)\n<span class="keyword">public</span> <span class="type">ResponseEntity&lt;String&gt;</span> getdata() {\n    <span class="keyword">return</span> <span class="type">ResponseEntity</span>.ok(<span class="string">"Resolved NullPointerException"</span>);\n}`
        },
        {
            id: "INFRA-K8S-092", type: "INFRA", service: "Order-DB-Pod", timestamp: new Date(Date.now() - 3600000).toISOString(),
            exception: "OOMKilled - Memory Limit Exceeded", location: "k8s/order-deployment.yaml", status: "PR_READY", filename: "order-deployment.yaml",
            rootCause: "PostgreSQL pod exceeded the 512Mi memory limit during bulk index recreation. AI recommends increasing limit to 1Gi.",
            patch: ` resources:\n   requests:\n     memory: <span class="string">"256Mi"</span>\n     cpu: <span class="string">"250m"</span>\n   limits:\n<span class="removed">-    memory: "512Mi"</span>\n<span class="added">+    memory: "1Gi"</span>\n     cpu: <span class="string">"500m"</span>`
        }
    ];

    let selectedIncident = incidents[0];

    function renderList() {
        const list = document.getElementById('incident-list');
        document.getElementById('incident-count').innerText = incidents.length;
        list.innerHTML = '';

        incidents.forEach(inc => {
            const isSelected = inc.id === selectedIncident.id;
            const icon = inc.type === 'APP' ? 'code-2' : 'server-crash';

            const cardStyle = isSelected
                ? 'bg-indigo-50 dark:bg-indigo-500/10 border-indigo-500 dark:border-indigo-400 shadow-sm'
                : 'bg-white dark:bg-slate-900 border-gray-200 dark:border-slate-800 hover:bg-gray-50 dark:hover:bg-slate-800/50';

            const badgeStyle = inc.type === 'APP'
                ? 'text-indigo-700 dark:text-indigo-400 bg-indigo-100 dark:bg-indigo-500/20 border-indigo-200 dark:border-indigo-500/30'
                : 'text-rose-700 dark:text-rose-400 bg-rose-100 dark:bg-rose-500/20 border-rose-200 dark:border-rose-500/30';

            const div = document.createElement('div');
            div.className = `p-3 rounded-xl border cursor-pointer transition-all ${cardStyle}`;
            div.onclick = () => selectIncident(inc);

            div.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border font-mono uppercase flex items-center gap-1.5 ${badgeStyle}">
              <i data-lucide="${icon}" class="w-3 h-3"></i> ${inc.type}
            </span>
            <span class="text-[9px] text-gray-500 dark:text-slate-500 font-mono">${new Date(inc.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>
          <p class="text-sm font-bold text-gray-900 dark:text-white truncate mb-0.5 tracking-tight">${inc.id}</p>
          <p class="text-[10px] text-gray-500 dark:text-slate-400 truncate"><span class="text-rose-600 dark:text-rose-400 font-mono font-medium">${inc.exception.split('.').pop()}</span> in ${inc.service}</p>
        `;
            list.appendChild(div);
        });
        lucide.createIcons();
    }

    function selectIncident(inc) {
        selectedIncident = inc;
        document.getElementById('detail-id').innerText = inc.id;
        document.getElementById('detail-exception').innerText = inc.exception + " at " + inc.location;
        document.getElementById('detail-root-cause').innerText = inc.rootCause;
        document.getElementById('detail-filename').innerText = inc.filename;
        document.getElementById('detail-patch').innerHTML = inc.patch;
        document.getElementById('detail-time').innerText = new Date(inc.timestamp).toLocaleString();

        const badge = document.getElementById('detail-type-badge');
        if (inc.type === 'APP') {
            badge.className = "text-[10px] font-bold px-2 py-0.5 rounded border tracking-wide uppercase text-indigo-700 dark:text-indigo-400 bg-indigo-100 dark:bg-indigo-500/20 border-indigo-200 dark:border-indigo-500/30";
            badge.innerText = "APPLICATION FAULT";
        } else {
            badge.className = "text-[10px] font-bold px-2 py-0.5 rounded border tracking-wide uppercase text-rose-700 dark:text-rose-400 bg-rose-100 dark:bg-rose-500/20 border-rose-200 dark:border-rose-500/30";
            badge.innerText = "INFRASTRUCTURE FAULT";
        }

        updatePRStatus(inc.status);
        renderList();
    }

    function updatePRStatus(status) {
        const container = document.getElementById('pr-status-container');
        const mergeBtn = document.getElementById('merge-btn');

        if (status === 'PR_READY') {
            container.innerHTML = `<i data-lucide="git-pull-request" class="w-4 h-4 text-emerald-600 dark:text-emerald-400"></i><span class="text-xs text-gray-700 dark:text-slate-300 font-bold tracking-wide">PR Created</span>`;
            mergeBtn.classList.remove('hidden');
        } else if (status === 'MERGED') {
            container.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600 dark:text-emerald-400"></i><span class="text-xs text-emerald-700 dark:text-emerald-400 font-bold uppercase tracking-wide">Fix Deployed</span>`;
            mergeBtn.classList.add('hidden');
        }
        lucide.createIcons();
    }

    function mergePullRequest() {
        const btn = document.getElementById('merge-btn');
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing...`;
        btn.classList.add('opacity-75', 'cursor-not-allowed');

        setTimeout(() => {
            selectedIncident.status = 'MERGED';
            updatePRStatus('MERGED');

            const targetService = services.find(s => s.name === selectedIncident.service);
            if(targetService) {
                targetService.status = 'healthy';
                targetService.latency = 25;
                renderServiceRibbon();
            }

            addChatMessage("System", `Pull Request for ${selectedIncident.id} merged successfully. CI/CD pipeline triggered. Service health restored.`);
        }, 1500);
    }

    document.getElementById('chat-form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        addChatMessage("You", text, true);
        input.value = '';

        setTimeout(() => {
            addChatMessage("Copilot", `Analyzing request for ${selectedIncident.id}... The patch is completely safe and affects only the explicit exception branch. Do you want me to execute \`kubectl apply\` for the updated manifest?`);
        }, 800);
    };

    function addChatMessage(sender, text, isUser = false) {
        const chat = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `chat-bubble flex gap-3 ${isUser ? 'flex-row-reverse' : ''}`;

        const avatar = isUser
            ? `<div class="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center shrink-0"><i data-lucide="user" class="w-3 h-3"></i></div>`
            : (sender === "System"
                ? `<div class="w-6 h-6 rounded-full bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 flex items-center justify-center shrink-0 border border-rose-200 dark:border-rose-500/30"><i data-lucide="terminal" class="w-3 h-3"></i></div>`
                : `<div class="w-6 h-6 rounded-full bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-400 flex items-center justify-center shrink-0 border border-indigo-200 dark:border-indigo-500/30"><i data-lucide="bot" class="w-3 h-3"></i></div>`);

        const bubbleClass = isUser
            ? `bg-indigo-600 text-white p-3 rounded-xl rounded-tr-none text-[13px] shadow-sm`
            : (sender === "System"
                ? `bg-rose-50 dark:bg-rose-500/10 p-3 rounded-xl rounded-tl-none text-[13px] text-rose-800 dark:text-rose-300 border border-rose-200 dark:border-rose-500/30 font-mono`
                : `bg-gray-50 dark:bg-slate-800 p-3 rounded-xl rounded-tl-none text-[13px] text-gray-700 dark:text-slate-200 border border-gray-200 dark:border-slate-700 shadow-sm leading-relaxed`);

        div.innerHTML = avatar + `<div class="${bubbleClass} max-w-[85%]">${text}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        lucide.createIcons();
    }

    window.onload = () => {
        renderServiceRibbon();
        renderList();
        selectIncident(incidents[0]);
    };
</script>
</body>
</html>
