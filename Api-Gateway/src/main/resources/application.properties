spring.application.name=Api-Gateway

eureka.instance.hostname=discovery-service
eureka.client.service-url.defaultZone=http://discovery-service:5000/eureka/
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client=DEBUG

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty=DEBUG


spring.r2dbc.url=r2dbc:postgresql://localhost:5433/Microservices
spring.r2dbc.username=postgres
spring.r2dbc.password=arun



#management.endpoint.gateway.enabled=true
#management.endpoint.gateway.access=unrestricted
#management.endpoints.web.exposure.include=*

management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.name=APi gateway default
info.app.version=1.0.0

#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true
#spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.routes[0].id=employee_service
spring.cloud.gateway.routes[0].uri=lb://employee-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/employee/**
#spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].id=address_service
spring.cloud.gateway.routes[1].uri=lb://address-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/address/**


spring.cloud.gateway.routes[2].id=servicerepository
spring.cloud.gateway.routes[2].uri=http://discovery-service:5000
spring.cloud.gateway.routes[2].predicates[0]=Path=/service
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1




spring.cloud.gateway.routes[3].id=Email_service
spring.cloud.gateway.routes[3].uri=lb://email-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/email/**
